<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浙招智达 · 管理后台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d9488' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 10v6M2 10l10-5 10 5-10 5z'/%3E%3Cpath d='M6 12v5c3 3 9 3 12 0v-5'/%3E%3C/svg%3E">
<script>
(function(){
  function retry(){
    if(window.echarts&&typeof initDashCharts==='function'){
      if(window._echartsPending&&location.hash.indexOf('dashboard')>-1){window._echartsPending=false;try{initDashCharts();}catch(e){}}
      return;
    }
    window._echartsPending=true;
  }
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js';
  s.onload=retry;
  s.onerror=function(){
    var s2=document.createElement('script');
    s2.src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js';
    s2.onload=retry;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
})();
</script>
<style>
:root{
  --t50:#f0fdfa;--t100:#ccfbf1;--t200:#99f6e4;--t300:#5eead4;--t400:#2dd4bf;--t500:#14b8a6;--t600:#0d9488;--t700:#0f766e;--t800:#115e59;--t900:#134e4a;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b;--s900:#0f172a;
  --primary:#0d9488;--primary-hover:#0f766e;--primary-deep:#115e59;
  --bg:#f5f7f6;--card:#ffffff;--border:#e3e8ee;
  --text:#0f172a;--muted:#64748b;
  --success:#10b981;--success-bg:#d1fae5;--warning:#d97706;--warning-bg:#fef3c7;--danger:#dc2626;--danger-bg:#fee2e2;--info:#2563eb;--info-bg:#dbeafe;
  --sidebar:#0e2e2a;--sidebar-hover:rgba(255,255,255,.05);--sidebar-active:rgba(45,212,191,.14);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --shadow-md:0 8px 24px -8px rgba(15,23,42,.12);
  --shadow-lg:0 24px 60px -20px rgba(15,23,42,.18);
  --r-sm:4px;--r-md:8px;--r-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::placeholder{color:#9aa8b8}
a{color:var(--primary);text-decoration:none}
svg{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--s700);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--t500);color:var(--primary);background:var(--t50)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--s600)}
.btn-ghost:hover{background:var(--s100);color:var(--s800);border-color:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn-lg{height:40px;padding:0 20px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r-md);color:var(--s500);transition:all .15s}
.icon-btn:hover{background:var(--s100);color:var(--s800)}
.input{height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--t500);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.select{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff;outline:none;cursor:pointer}
.select:focus{border-color:var(--t500)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1}
.tag-teal{background:var(--t100);color:var(--t800)}
.tag-blue{background:var(--info-bg);color:#1d4ed8}
.tag-purple{background:#ede9fe;color:#6d28d9}
.tag-gray{background:var(--s100);color:var(--s600)}
.tag-green{background:var(--success-bg);color:#047857}
.tag-amber{background:var(--warning-bg);color:#b45309}
.tag-red{background:var(--danger-bg);color:#b91c1c}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:20px}
.card-title{font-size:15px;font-weight:600;color:var(--s800)}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.tbl th{background:var(--s50);color:var(--s600);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--s100);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tbl tr:hover td{background:#fafcfb}
table.tbl tr:last-child td{border-bottom:none}
.rowlink{color:var(--primary);font-weight:500;cursor:pointer}
.rowlink:hover{text-decoration:underline}
.op-links{display:flex;gap:2px}
.op-links button{font-size:12.5px;color:var(--s500);padding:3px 7px;border-radius:6px;white-space:nowrap}
.op-links button:hover{background:var(--t50);color:var(--primary)}
.op-links button.danger:hover{background:var(--danger-bg);color:var(--danger)}
.checkbox{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;animation:pop .18s ease}
.modal-lg{max-width:860px}
.modal-xl{max-width:1060px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-body{padding:20px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-item{display:flex;flex-direction:column;gap:6px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:12.5px;color:var(--s600);font-weight:500}
.form-item label .req{color:var(--danger);margin-left:2px}
.form-item .hint{font-size:11.5px;color:#94a3b8}
.form-sec{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--s800);margin:6px 0 2px}
.form-sec:first-child{margin-top:0}
.form-sec::after{content:'';flex:1;height:1px;background:var(--s100)}
/* toast */
#toasts{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:10px 16px;font-size:13.5px;animation:slideIn .2s ease;max-width:360px}
.toast.success .t-ico{color:var(--success)}.toast.error .t-ico{color:var(--danger)}.toast.info .t-ico{color:var(--info)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab-btn{padding:10px 16px;font-size:13.5px;color:var(--s500);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab-btn:hover{color:var(--s800)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* 分页 */
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 2px;flex-wrap:wrap;gap:10px}
.pager-info{font-size:12.5px;color:var(--muted)}
.pager-btns{display:flex;align-items:center;gap:4px}
.pg{min-width:30px;height:30px;padding:0 6px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--s600);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center}
.pg:hover{border-color:var(--t500);color:var(--primary)}
.pg.active{background:var(--primary);border-color:var(--primary);color:#fff}
.pg:disabled{opacity:.4;cursor:not-allowed}
/* 视图切换 */
.view{display:none}
.view.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* 空态 */
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .e-ico{width:48px;height:48px;margin:0 auto 12px;border-radius:50%;background:var(--s100);display:flex;align-items:center;justify-content:center;color:var(--s400)}
.empty p{font-size:13.5px}
.empty .btn{margin-top:14px}
/* ===== 登录页 ===== */
#view-login{position:fixed;inset:0;display:none;z-index:50}
#view-login.active{display:flex}
.login-wrap{display:flex;width:100%;height:100%}
.login-brand{flex:1.15;background:linear-gradient(150deg,#0e2e2a 0%,#134e4a 55%,#115e59 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:64px;position:relative;overflow:hidden}
.login-brand::before{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.28),transparent 65%)}
.login-brand::after{content:"";position:absolute;left:-90px;bottom:-140px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.16),transparent 65%)}
.brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand-logo .logo-ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(20,184,166,.35)}
.brand-name{font-size:22px;font-weight:700;letter-spacing:.5px}
.brand-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;letter-spacing:2px}
.login-brand h1{font-size:30px;font-weight:700;line-height:1.35;margin-top:44px;max-width:420px}
.login-brand .slogan{font-size:15px;color:rgba(255,255,255,.72);margin-top:14px;max-width:430px;line-height:1.8}
.login-stats{display:flex;gap:34px;margin-top:48px}
.login-stats .ls{font-size:12.5px;color:rgba(255,255,255,.55)}
.login-stats .ls b{display:block;font-size:24px;color:#fff;font-weight:700;margin-bottom:2px}
.login-form{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;padding:40px}
.lf-card{width:100%;max-width:360px}
.lf-card h2{font-size:24px;font-weight:700;letter-spacing:.5px}
.lf-card .lf-sub{color:var(--muted);font-size:13.5px;margin-top:6px;margin-bottom:32px}
.lf-field{margin-bottom:16px}
.lf-field label{display:block;font-size:13px;color:var(--s700);margin-bottom:7px;font-weight:500}
.lf-input{display:flex;align-items:center;gap:9px;height:42px;border:1px solid var(--border);border-radius:var(--r-md);padding:0 13px;transition:all .15s}
.lf-input:focus-within{border-color:var(--t500);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.lf-input svg{color:var(--s400)}
.lf-input input{border:none;outline:none;flex:1;height:100%;font-size:14px}
.lf-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px;font-size:12.5px}
.lf-row label{display:flex;align-items:center;gap:6px;color:var(--s600);cursor:pointer}
.lf-row a{color:var(--primary)}
.lf-hint{margin-top:14px;text-align:center;font-size:12px;color:#94a3b8}
/* ===== 应用外壳 ===== */
#app{display:none;height:100vh;overflow:hidden}
#app.active{display:flex}
.sidebar{width:224px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.side-logo{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.side-logo .logo-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.side-logo .sl-name{font-size:15.5px;font-weight:700;letter-spacing:.5px}
.side-logo .sl-sub{font-size:10.5px;color:rgba(255,255,255,.5);letter-spacing:1.5px;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.nav-group{margin-bottom:6px}
.nav-glabel{font-size:11px;color:rgba(255,255,255,.42);letter-spacing:1px;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;color:rgba(255,255,255,.78);cursor:pointer;transition:all .12s;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--sidebar-active);color:var(--t300);font-weight:600}
.nav-item .n-arrow{margin-left:auto;transition:transform .15s}
.nav-item.open .n-arrow{transform:rotate(180deg)}
.nav-sub{display:none;margin:2px 0 4px;padding-left:12px}
.nav-sub.open{display:block}
.nav-sub .nav-item{padding-left:34px;font-size:13px;padding-top:7px;padding-bottom:7px}
.nav-sub .nav-item::before{content:"";position:absolute;left:20px;top:50%;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transform:translateY(-50%)}
.nav-sub .nav-item.active::before{background:var(--t300)}
.side-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.side-user .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0d9488);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.side-user .su-name{font-size:13px;font-weight:600;white-space:nowrap}
.side-user .su-role{font-size:11px;color:rgba(255,255,255,.5)}
.side-user .su-exit{margin-left:auto;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px}
.side-user .su-exit:hover{background:var(--sidebar-hover);color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0}
.tb-crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.tb-crumb b{color:var(--s800);font-weight:600}
.tb-crumb .sep{color:var(--s300)}
.tb-search{position:relative;margin-left:auto;width:280px}
.tb-search .input{width:100%;padding-left:36px;height:34px;background:var(--s50);border-color:transparent}
.tb-search .input:focus{background:#fff}
.tb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--s400)}
.tb-search-res{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);z-index:40;display:none;overflow:hidden}
.tb-search-res.open{display:block}
.tb-search-res .sr-item{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--s50)}
.tb-search-res .sr-item:hover{background:var(--t50)}
.tb-search-res .sr-item:last-child{border-bottom:none}
.tb-actions{display:flex;align-items:center;gap:6px}
.bell{position:relative}
.bell .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.tb-user{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--border)}
.tb-user .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.tb-user .tu-name{font-size:13px;font-weight:600}
.tb-user .tu-role{font-size:11px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:22px 24px 40px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:700;letter-spacing:.2px}
.page-head .ph-sub{font-size:13px;color:var(--muted);margin-top:4px}
.ph-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ===== 工作台 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{padding:18px 20px;display:flex;align-items:flex-start;gap:14px}
.stat-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico.teal{background:var(--t100);color:var(--t700)}
.stat-ico.blue{background:var(--info-bg);color:#1d4ed8}
.stat-ico.purple{background:#ede9fe;color:#6d28d9}
.stat-ico.amber{background:var(--warning-bg);color:#b45309}
.stat-val{font-size:24px;font-weight:700;line-height:1.2}
.stat-lbl{font-size:12.5px;color:var(--muted);margin-top:2px}
.stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;margin-top:6px;padding:1px 7px;border-radius:999px;background:var(--success-bg);color:#047857;font-weight:500}
.stat-delta.down{background:var(--danger-bg);color:#b91c1c}
.dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{padding:18px 20px}
.chart-box{height:250px;margin-top:8px}
.chart-donut{height:250px;margin-top:8px}
.dash-grid2{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:16px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--s100)}
.list-item:last-child{border-bottom:none}
.list-item .avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.li-main{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-ft{margin-top:12px;padding-top:12px;border-top:1px solid var(--s100);display:flex;justify-content:center}
/* ===== 筛选条 ===== */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
.filter-bar .input,.filter-bar .select{height:32px}
.fb-label{font-size:12.5px;color:var(--s600);font-weight:500}
/* ===== 表格工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar .tb-title{font-size:14.5px;font-weight:600;margin-right:4px}
.toolbar .spacer{flex:1}
.badge-count{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--t100);color:var(--t800);font-size:11.5px;font-weight:600}
/* ===== 用户详情 ===== */
.user-hero{display:flex;align-items:center;gap:18px;padding:22px 24px;margin-bottom:16px;flex-wrap:wrap}
.user-hero .avatar{width:64px;height:64px;border-radius:16px;font-size:24px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uh-main{flex:1;min-width:240px}
.uh-name{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.uh-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.uh-meta span{display:flex;align-items:center;gap:5px}
.uh-actions{display:flex;gap:10px;flex-wrap:wrap}
.kv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kv{background:var(--s50);border:1px solid var(--s100);border-radius:var(--r-md);padding:12px 14px}
.kv .k{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.kv .v{font-size:13.5px;color:var(--s800);font-weight:500;word-break:break-all}
.grade-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.grade-cell{background:var(--s50);border:1px solid var(--s100);border-radius:var(--r-md);padding:10px 12px;text-align:center}
.grade-cell .gc-sub{font-size:11.5px;color:var(--muted)}
.grade-cell .gc-val{font-size:20px;font-weight:700;margin-top:2px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:12.5px;color:var(--s700)}
.chip.pick{background:var(--t50);border-color:var(--t300);color:var(--t700)}
.chip.x{background:var(--danger-bg);border-color:transparent;color:var(--danger)}
/* ===== 步骤条 ===== */
.steps{display:flex;align-items:flex-start;margin-bottom:24px;padding:0 8px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;gap:8px}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:var(--s200)}
.step.done:not(:last-child)::after{background:var(--t500)}
.step .s-dot{width:34px;height:34px;border-radius:50%;background:var(--s100);border:2px solid var(--s200);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--s500);z-index:1}
.step.active .s-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .s-dot{background:var(--t500);border-color:var(--t500);color:#fff}
.step .s-name{font-size:12.5px;color:var(--s600);text-align:center;padding:0 4px}
.step.active .s-name{color:var(--primary);font-weight:600}
.step.done .s-name{color:var(--t700)}
.wizard-body{min-height:360px}
.wz-actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
/* 方案类型卡片 */
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.type-card{border:2px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;transition:all .15s;position:relative}
.type-card:hover{border-color:var(--t400);box-shadow:var(--shadow-md)}
.type-card.selected{border-color:var(--primary);background:var(--t50)}
.type-card .tc-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.type-card .tc-ico.teal{background:var(--t100);color:var(--t700)}
.type-card .tc-ico.blue{background:var(--info-bg);color:#1d4ed8}
.type-card h3{font-size:16px;font-weight:700}
.type-card .tc-desc{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.type-card .tc-count{position:absolute;top:14px;right:14px}
/* 学考等级 */
.grade-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.gp-subject{background:var(--s50);border:1px solid var(--s100);border-radius:var(--r-md);padding:12px;text-align:center}
.gp-subject .gp-name{font-size:13px;font-weight:600;margin-bottom:8px}
.gp-opts{display:flex;justify-content:center;gap:4px}
.gp-opt{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--s500);display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.gp-opt:hover{border-color:var(--t500);color:var(--primary)}
.gp-opt.pick{background:var(--primary);border-color:var(--primary);color:#fff}
.subject-pick{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;transition:all .12s}
.subject-pick:hover{border-color:var(--t400)}
.subject-pick.pick{background:var(--t50);border-color:var(--t500);color:var(--t700);font-weight:600}
/* 志愿选择 */
.wz-split{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.major-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;background:#fff;transition:all .12s}
.major-item:hover{border-color:var(--t400);box-shadow:var(--shadow-sm)}
.major-item.added{border-color:var(--t300);background:var(--t50)}
.mi-main{flex:1;min-width:0}
.mi-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.mi-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;font-size:11.5px;color:var(--muted)}
.mi-meta span{display:flex;align-items:center;gap:4px}
.rl-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;background:#fff}
.rl-item .rl-idx{width:26px;height:26px;border-radius:50%;background:var(--s100);color:var(--s600);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rl-item .rl-main{flex:1;min-width:0}
.rl-item .rl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-item .rl-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-item .rl-op{display:flex;gap:2px}
.rl-item .rl-op button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--s400)}
.rl-item .rl-op button:hover{background:var(--s100);color:var(--s700)}
.rl-item .rl-op button.up:hover{color:var(--primary)}
.rl-item .rl-op button.del:hover{background:var(--danger-bg);color:var(--danger)}
.risk-badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600}
.risk-chong{background:#fee2e2;color:#b91c1c}
.risk-wen{background:var(--warning-bg);color:#b45309}
.risk-bao{background:var(--success-bg);color:#047857}
/* 方案预览 */
.plan-preview{display:flex;flex-direction:column;gap:10px}
.pp-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);background:#fff}
.pp-main{flex:1;min-width:0}
.pp-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.pp-sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.pp-sub span{display:flex;align-items:center;gap:4px}
.pp-score{text-align:right}
.pp-score .ps-val{font-size:18px;font-weight:700;color:var(--primary)}
.pp-score .ps-lbl{font-size:11px;color:var(--muted)}
/* ===== 方案结果（对齐前端方案结果页呈现） ===== */
.pr-hero{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;border:1px solid var(--t200);border-radius:var(--r-lg);background:linear-gradient(135deg,#f0fdfa 0%,#fff 55%);margin-bottom:16px}
.pr-hero .pr-h-ico{width:44px;height:44px;border-radius:12px;background:var(--t100);color:var(--t700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pr-hero .pr-h-title{font-size:16.5px;font-weight:700;color:var(--s900);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr-hero .pr-h-sub{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.pr-hero .pr-h-meta{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.pr-score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.pr-score-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.pr-score-card .psc-ico{width:36px;height:36px;border-radius:9px;background:var(--t50);color:var(--t700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pr-score-card .psc-cap{font-size:11px;color:var(--muted);margin-bottom:4px}
.pr-score-card .psc-val{font-size:13px;font-weight:600;color:var(--s800);line-height:1.55;word-break:break-all}
.pr-score-card .psc-val.num{font-size:22px;font-weight:700;color:var(--t700)}
.risk-group{margin-bottom:18px}
.risk-group .rg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.risk-group .rg-badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700}
.risk-group .rg-title{font-size:14.5px;font-weight:700;color:var(--s900)}
.risk-group .rg-count{font-size:12px;color:var(--muted)}
.risk-group .rg-note{font-size:12px;color:var(--muted);margin-left:auto}
.risk-group .rg-cards{display:flex;flex-direction:column;gap:10px}
.pr-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.pr-card .prc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pr-card .prc-school{font-size:14.5px;font-weight:700;color:var(--s900)}
.pr-card .prc-score{margin-left:auto;text-align:right}
.pr-card .prc-score .pv{font-size:19px;font-weight:700;color:var(--primary)}
.pr-card .prc-score .pl{font-size:11px;color:var(--muted)}
.pr-card .prc-reason{font-size:12.5px;color:var(--s700);margin-top:9px;line-height:1.6;background:var(--s50);padding:9px 12px;border-radius:8px}
.pr-card .prc-reason b{color:var(--s800)}
.pr-card .prc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pr-card .prc-meta .chip{font-size:11.5px;color:var(--s600);background:#fff;border:1px solid var(--s200);padding:3px 8px;border-radius:6px}
.pr-card .prc-conf{margin-left:auto;text-align:right}
.pr-card .prc-conf .pv{font-size:18px;font-weight:700;color:var(--primary)}
.pr-card .prc-conf .pl{font-size:11px;color:var(--muted)}
.pr-card .prc-group{margin-top:10px;padding:8px 12px;border:1px dashed var(--s200);border-radius:8px;font-size:12.5px;color:var(--s700);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--s25,#fafcfb)}
.pr-card .prc-group b{color:var(--s800)}
.pr-card .prc-group .pg-majors{color:var(--s600)}
.pr-timeline{margin-top:4px;position:relative;padding-left:18px;border-left:2px solid var(--s200)}
.pr-tl-item{position:relative;padding:0 0 16px 14px}
.pr-tl-item:last-child{padding-bottom:2px}
.pr-tl-item::before{content:'';position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--t600);border:2px solid #fff;box-shadow:0 0 0 2px var(--t100)}
.pr-tl-item .pt-date{font-size:12.5px;font-weight:700;color:var(--t700)}
.pr-tl-item .pt-title{font-size:13.5px;font-weight:600;color:var(--s800);margin-top:2px}
.pr-tl-item .pt-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.pr-tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pr-tip-box{border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;background:#fff}
.pr-tip-box h4{font-size:13.5px;font-weight:700;color:var(--s800);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.pr-tip-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pr-tip-box li{font-size:12.5px;color:var(--s600);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
.pr-tip-box li svg{flex-shrink:0;margin-top:2px}
.pr-selected{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pr-selected .sel-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--s50);border:1px solid var(--s200);border-radius:999px;padding:4px 10px;color:var(--s700)}
.pr-selected .sel-chip .n{width:16px;height:16px;border-radius:50%;background:var(--t600);color:#fff;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
@media (max-width:1200px){.pr-score-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.pr-score-grid{grid-template-columns:1fr}.pr-tips{grid-template-columns:1fr}.pr-hero{flex-direction:column}.pr-hero .pr-h-meta{margin-left:0;text-align:left}}
/* 上传 */
.upload-drop{border:2px dashed var(--s300);border-radius:var(--r-lg);padding:38px 20px;text-align:center;transition:all .15s;cursor:pointer;background:var(--s50)}
.upload-drop:hover,.upload-drop.drag{border-color:var(--t500);background:var(--t50)}
.upload-drop .ud-ico{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--t100);color:var(--t700);display:flex;align-items:center;justify-content:center}
.upload-drop h4{font-size:15px;font-weight:600}
.upload-drop p{font-size:12.5px;color:var(--muted);margin-top:6px}
.upload-drop .btn{margin-top:16px}
.upload-file{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--t300);background:var(--t50);border-radius:var(--r-md);margin-top:14px}
.upload-file .uf-name{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-progress{height:6px;border-radius:4px;background:var(--s200);margin-top:12px;overflow:hidden}
.upload-progress .up-bar{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.upload-result{display:flex;gap:14px;margin-bottom:14px}
.ur-box{flex:1;border-radius:var(--r-md);padding:14px;text-align:center}
.ur-box .ur-num{font-size:22px;font-weight:700}
.ur-box .ur-lbl{font-size:12px;margin-top:3px}
.ur-ok{background:var(--success-bg);color:#047857}
.ur-err{background:var(--danger-bg);color:#b91c1c}
.ur-skip{background:var(--s100);color:var(--s600)}
.err-row td{color:var(--danger)}
/* 数据管理分组 */
.dm-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.dm-cell{display:flex;align-items:center;gap:12px;padding:14px 16px}
.dm-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dm-cell .dm-name{font-size:13.5px;font-weight:600}
.dm-cell .dm-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.dm-cell .dm-num{margin-left:auto;font-size:20px;font-weight:700}
/* 详情抽屉 */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.detail-item{padding:10px 0;border-bottom:1px solid var(--s100);display:flex;gap:14px}
.detail-item .dk{width:130px;flex-shrink:0;font-size:12.5px;color:var(--muted)}
.detail-item .dv{flex:1;font-size:13px;color:var(--s800);word-break:break-all}
/* 响应式 */
@media (max-width:1200px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .dash-grid2{grid-template-columns:1fr}
  .kv-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .sidebar{width:64px}
  .side-logo .sl-name,.side-logo .sl-sub,.nav-glabel,.nav-item span,.side-user .su-name,.side-user .su-role,.side-user .su-exit{display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item .n-arrow{display:none}
  .nav-sub .nav-item{padding-left:0}
  .side-user{justify-content:center;padding:10px}
  .login-brand{display:none}
  .type-cards{grid-template-columns:1fr}
  .grade-picker{grid-template-columns:repeat(3,1fr)}
  .wz-split{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .dm-summary{grid-template-columns:1fr}
  .tb-search{width:200px}
}
@media (max-width:640px){
  .content{padding:16px 14px 32px}
  .stat-grid{grid-template-columns:1fr}
  .kv-grid{grid-template-columns:1fr}
  .grade-grid{grid-template-columns:repeat(2,1fr)}
  .tb-search{display:none}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>

</div>

<!-- ===== 应用外壳 ===== -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-logo">
      <div class="logo-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <div><div class="sl-name">浙招智达</div><div class="sl-sub">管理后台</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user">

function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'success');
  const ico=type==='error'?'alert':(type==='info'?'info':'check');
  t.innerHTML='<span class="t-ico">'+ic(ico,15)+'</span><span>'+esc(msg)+'</span>';

}

}

function confirmModal(opts){
  openModal('<div class="modal-head"><h3>'+esc(opts.title||'操作确认')+'</h3><button class="icon-btn" onclick="closeModal()">'+ic('x',16)+'</button></div>'

function renderNav(){
  let h='';
  NAV.forEach(g=>{
    if(g.type==='group'){
      h+='<div class="nav-group"><div class="nav-glabel">'+g.label+'</div>';
      g.items.forEach(it=>{h+='<div class="nav-item" data-nav="'+it.key+'" onclick="navTo(\''+it.route+'\')">'+ic(it.icon,17)+'<span>'+it.name+'</span></div>';});
      h+='</div>';
    }else{
      h+='<div class="nav-group"><div class="nav-glabel">'+g.label+'</div>';

        h+='<div class="nav-item sg-head" data-nav="'+sg.key+'" onclick="toggleSub(\''+sg.key+'\')">'+ic(sg.icon,17)+'<span>'+sg.name+'</span><span class="n-arrow">'+ic('chevD',13)+'</span></div>';
        h+='<div class="nav-sub" id="sub-'+sg.key+'">';

        h+='</div>';
      });
      h+='</div>';
    }
  });

}
function toggleSub(key){const s=$('#sub-'+key);s.classList.toggle('open');$('[data-nav="'+key+'"]').classList.toggle('open');}
function setActiveNav(keys){
  document.querySelectorAll('#nav .nav-item').forEach(n=>n.classList.remove('active'));
  keys.forEach(k=>{const el=document.querySelector('[data-nav="'+k+'"]');if(el){el.classList.add('active');
    const sub=el.closest('.nav-sub');if(sub){sub.classList.add('open');const head=sub.previousElementSibling;if(head)head.classList.add('open');}}});
}
/* —— 路由 —— */
function parseHash(){
  const raw=location.hash.replace(/^#\/?/,'');
  const parts=raw.split('?')[0].split('/');
  return {name:parts[0],arg:parts[1],arg2:parts[2]};
}
function navTo(route){location.hash=route;}
window.addEventListener('hashchange',router);
function router(){
  const r=parseHash();
  const view=document.querySelector('#view-login');
  const app=$('#app');
  if(r.name==='login'||!app.classList.contains('active')){view.classList.add('active');app.classList.remove('active');return;}
  view.classList.remove('active');app.classList.add('active');
  const c=$('#content');
  let html='',crumb=[];
  switch(r.name){
    case 'dashboard': html=vDashboard();crumb=[{t:'工作台'}];break;
    case 'users': html=vUsers();crumb=[{t:'用户管理'}];break;
    case 'user': html=vUserDetail(r.arg);crumb=[{t:'用户管理',l:'#/users'},{t:userById(r.arg)?userById(r.arg).name:'用户详情'}];break;
    case 'plan': html=vPlan();crumb=[{t:'方案规划'}];break;
    case 'data': html=vData(r.arg);{const t=TBL[r.arg];crumb=[{t:'数据管理'},{t:t?GROUP_NAME[t.group]:''},{t:t?t.name:'数据表'}];}break;
    default: html=vDashboard();crumb=[{t:'工作台'}];
  }
  c.innerHTML=html;
  renderCrumb(crumb);
  setActiveNav(navKeysFor(r));
  afterRender(r);
}
function navKeysFor(r){
  if(r.name==='dashboard')return ['dashboard'];
  if(r.name==='users')return ['users'];
  if(r.name==='user')return ['users'];
  if(r.name==='plan')return ['plan'];
  if(r.name==='data'){const t=TBL[r.arg];return t?['sg-data',t.group,'data-'+t.key]:['sg-data'];}
  return [];
}
function renderCrumb(items){
  $('#tb-crumb').innerHTML=items.map((c,i)=>i<items.length-1?(c.l?'<a href="'+c.l+'">'+c.t+'</a>':'<span>'+c.t+'</span>')+'<span class="sep">/</span>':'<b>'+c.t+'</b>').join('');
}
function afterRender(r){

}

function globalSearch(v){
  const box=$('#gs-res');
  if(!v.trim()){box.classList.remove('open');return;}
  const res=[];
  USERS.filter(u=>u.name.includes(v)||u.uid.includes(v)||u.phone.includes(v)).forEach(u=>res.push({t:'用户 · '+u.name,sub:u.school+' / '+u.types.join('、'),act:()=>navTo('#/user/'+u.id)}));
  TABLES.forEach(t=>{
    const tbl=ROWS[t.key];
    for(let i=0;i<tbl.length&&res.length<9;i++){
      const row=tbl[i];
      if((row.school||row.name||'').includes(v)||(row.mname||'').includes(v)){
        res.push({t:'['+t.name+'] '+(row.school||row.name),sub:(row.mname||row.code||row.id),act:()=>{navTo('#/data/'+t.key);setTimeout(()=>toast('已定位到数据表：'+t.name,'info'),100);}});
        break;
      }
    }
  });
  if(!res.length)box.innerHTML='<div class="sr-item" style="color:var(--muted)">未找到相关结果</div>';
  else box.innerHTML=res.slice(0,8).map(r=>'<div class="sr-item" onclick="gsGo(this)">'+ic('search',14)+'<div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.t)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(r.sub)+'</div></div></div>').join('');
  window._gsRes=res;
  box.classList.add('open');
}
function gsGo(el){
  const idx=[...el.parentNode.children].indexOf(el);
  const r=(window._gsRes||[])[idx];
  if(r){r.act();$('#global-search').value='';$('#gs-res').classList.remove('open');}
}

const SCH_SANY={浙江工业大学:{prop:'省重点',type:'综合类'},宁波大学:{prop:'双一流',type:'综合类'},浙江工商大学:{prop:'省重点',type:'财经类'},浙江中医药大学:{prop:'省重点',type:'医药类'},浙江师范大学:{prop:'省重点',type:'师范类'}};
function gaozhiSchMeta(school){

function xkCalc(type,grades){
  const m=type==='sanyi'?{A:10,B:8,C:6,D:4,E:2}:{A:90,B:80,C:70,D:60,E:50};
  let sum=0,n=0;SUBJECTS.forEach(s=>{const g=grades[s];if(g&&m[g]){sum+=m[g];n++;}});

function dataPagerHtml(t,total,pages){
  return `<span class="pager-info">共 ${total} 条 · 第 ${DT.page}/${pages} 页 · 每页 ${DT.pageSize} 条</span>
  <div class="pager-btns"><button class="pg" ${DT.page<=1?'disabled':''} onclick="DT.page--;dtRefreshPart()">${ic('chevL',13)}</button>${Array.from({length:Math.min(pages,7)},(_,i)=>`<button class="pg ${i+1===DT.page?'active':''}" onclick="DT.page=${i+1};dtRefreshPart()">${i+1}</button>`).join('')}${pages>7?'<span style="color:var(--muted);font-size:12px">…</span>':''}<button class="pg" ${DT.page>=pages?'disabled':''} onclick="DT.page++;dtRefreshPart()">${ic('chevR',13)}</button></div>`;
}
function dtFilter(key,v){DT.kw=v;DT.page=1;dtRefreshPart();}
function dtRefreshPart(){
  const t=TBL[DT.key];if(!t)return;
  const rows=filterDataRows(t);
  const pages=Math.max(1,Math.ceil(rows.length/DT.pageSize));
  if(DT.page>pages)DT.page=pages;
  const start=(DT.page-1)*DT.pageSize;
  $('#dt-tbody').innerHTML=dataRowsHtml(t,rows.slice(start,start+DT.pageSize));
  $('#dt-pager').innerHTML=dataPagerHtml(t,rows.length,pages);
  $('#dt-count').textContent=ROWS[t.key].length+' 条';
  const all=$('#dt-ck-all');if(all)all.checked=DT.sel.size===rows.length&&rows.length>0;
}
function renderData(key){router();}
function dtToggle(key,id,on){const row=ROWS[key].find(r=>r.id===id);if(!row)return;on?DT.sel.add(id):DT.sel.delete(id);const all=$('#dt-ck-all');if(all)all.checked=DT.sel.size===ROWS[key].length;}
function dtToggleAll(on){const t=TBL[DT.key];if(!t)return;DT.sel.clear();if(on)ROWS[t.key].forEach(r=>DT.sel.add(r.id));dtRefreshPart();}
function dtBatchDel(key){
  const n=DT.sel.size;
  confirmModal({title:'批量删除数据',message:'确定要删除选中的 <b>'+n+'</b> 条记录吗？该操作不可恢复。',danger:true,okText:'删除',onOk:()=>{
    DT.sel.forEach(id=>{const i=ROWS[key].findIndex(r=>r.id===id);if(i>-1)ROWS[key].splice(i,1);});
    DT.sel.clear();renderData(key);toast('已删除 '+n+' 条记录');
  }});
}
/* —— 行查看 / 新增 / 编辑 —— */
function viewRow(key,id){
  const t=TBL[key],r=ROWS[key].find(x=>x.id===id);if(!r)return;
  openModal(`<div class="modal-head"><h3>${esc(t.name)} · 记录详情</h3><button class="icon-btn" onclick="closeModal()">${ic('x',16)}</button></div>
  <div class="modal-body">
    <div class="detail-grid">${t.fields.map(f=>`<div class="detail-item"><div class="dk">${f.label}${f.hint?'<div style="font-size:10.5px;color:#b6c2cf">'+esc(f.hint)+'</div>':''}</div><div class="dv">${esc(fmt(r[f.k]))}</div></div>`).join('')}</div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--s100);display:flex;gap:16px;font-size:11.5px;color:#94a3b8"><span>记录ID：${esc(r.id)}</span><span>创建人：张老师</span><span>更新时间：2026-09-30 18:22</span></div>
  </div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="openRowEdit('${key}','${esc(r.id)}');">编辑</button></div>`,'modal-lg');
}
function openRowEdit(key,id){
  const t=TBL[key],r=id?ROWS[key].find(x=>x.id===id):null;
  openModal(`<div class="modal-head"><h3>${r?'编辑记录':'新增记录'} · ${esc(t.name)}</h3><button class="icon-btn" onclick="closeModal()">${ic('x',16)}</button></div>
  <div class="modal-body"><div class="form-grid">
    ${t.fields.map(f=>{const v=r?r[f.k]:'';let ctl;
      if(f.type==='select')ctl=`<select class="select" id="rf-${f.k}">${f.opts.map(o=>'<option value="'+o+'" '+(String(v)===o?'selected':'')+'>'+o+'</option>').join('')}</select>`;
      else if(f.type==='textarea')ctl=`<textarea class="input" id="rf-${f.k}" style="height:64px;padding:8px 12px;resize:vertical" placeholder="请输入${f.label}">${esc(v)}</textarea>`;
      else if(f.type==='number')ctl=`<input class="input" id="rf-${f.k}" type="number" value="${esc(v)}" placeholder="请输入${f.label}">`;
      else ctl=`<input class="input" id="rf-${f.k}" value="${esc(v)}" placeholder="请输入${f.label}">`;
      return `<div class="form-item ${f.type==='textarea'?'full':''}"><label>${f.label}${f.k==='code'||f.k==='id'||f.k==='school'||f.k==='mname'?'<span class="req">*</span>':''}${f.hint?'<span class="hint">（'+esc(f.hint)+'）</span>':''}</label>${ctl}</div>`;}).join('')}
  </div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="row-save">${r?'保存修改':'创建记录'}</button></div>`,'modal-xl');
  $('#row-save').onclick=()=>{
    const data={};let ok=true;
    t.fields.forEach(f=>{const el=$('#rf-'+f.k);if(!el){data[f.k]='';return;}
      data[f.k]=f.type==='number'?(el.value?Number(el.value):''):el.value;
      if((f.k==='code'||f.k==='id'||f.k==='school'||f.k==='mname')&&!data[f.k])ok=false;});
    if(!ok){toast('请填写必填字段（带 * 号）','error');return;}
    if(r){Object.assign(r,data);toast('记录已更新');}
    else{const nid='R'+Date.now().toString(36).toUpperCase();ROWS[key].unshift(Object.assign({id:nid},data));toast('记录已创建');}
    closeModal();renderData(key);
  };
}
function delRow(key,id){
  confirmModal({title:'删除记录',message:'确定要删除这条记录吗？该操作不可恢复。',danger:true,okText:'删除',onOk:()=>{const i=ROWS[key].findIndex(r=>r.id===id);if(i>-1)ROWS[key].splice(i,1);renderData(key);toast('记录已删除');}});
}
/* —— 批量上传 —— */
let UP={table:'',fileName:'',step:1,ok:0,err:0};
function uploadModal(tableKey){
  UP={table:tableKey,fileName:'',step:1,ok:0,err:0};
  const name=uploadName(tableKey);
  openModal(`<div class="modal-head"><h3>批量上传 · ${esc(name)}</h3><button class="icon-btn" onclick="closeModal()">${ic('x',16)}</button></div>
  <div class="modal-body" id="up-body">${uploadStepHtml()}</div>`,'modal-lg');
}
function uploadName(tableKey){
  if(tableKey==='users')return '用户列表';
  const t=TBL[tableKey];return t?t.name:tableKey;
}
function uploadStepHtml(){
  const name=uploadName(UP.table);
  if(UP.step===1)return `<div class="upload-drop" id="up-drop" onclick="$('#up-file').click()" ondragover="this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="upDrop(event)">
    <div class="ud-ico">${ic('upload',24)}</div>
    <h4>将 Excel 文件拖到此处，或点击选择文件</h4>
    <p>支持 .xlsx / .csv 格式，单次不超过 5MB · 表头需与下载模板保持一致</p>
    <button class="btn btn-primary">${ic('file',14)} 选择文件</button>
    <input type="file" id="up-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="upPick(this)">
    <div style="margin-top:16px;font-size:12.5px;color:var(--muted)">首次使用请先 <a href="javascript:;" onclick="toast('已生成模板：'+'${esc(name)}'+'.xlsx','info')">下载模板</a>，按模板列名填写后上传，系统将按字段自动校验。</div>
  </div>`;
  if(UP.step===2)return `<div class="upload-file"><div style="color:var(--t700)">${ic('file',22)}</div><div class="uf-name">${esc(UP.fileName)}</div><span class="tag tag-green">已解析</span></div>
  <div class="upload-result">
    <div class="ur-box ur-ok"><div class="ur-num num">${UP.ok}</div><div class="ur-lbl">校验通过</div></div>
    <div class="ur-box ur-err"><div class="ur-num num">${UP.err}</div><div class="ur-lbl">校验失败</div></div>
    <div class="ur-box ur-skip"><div class="ur-num num">0</div><div class="ur-lbl">跳过行</div></div>
  </div>
  <div class="card-sub" style="margin-bottom:10px">校验结果预览（失败行不会导入）</div>
  <div class="table-wrap" style="max-height:220px;overflow-y:auto;border:1px solid var(--s100);border-radius:var(--r-md)">
  <table class="tbl"><colgroup><col style="width:13%"><col style="width:27%"><col style="width:35%"><col style="width:25%"></colgroup>
  <thead><tr><th>行号</th><th>院校 / 用户</th><th>专业 / 姓名</th><th>校验结果</th></tr></thead>
  <tbody>${UP.err>0?`<tr class="err-row"><td>3</td><td>示例大学</td><td>示例专业</td><td>院校代码为空</td></tr>`:''}${Array.from({length:Math.min(UP.ok,3)},(_,i)=>`<tr><td class="num">${5+i}</td><td>示例大学</td><td>示例专业</td><td><span class="tag tag-green">通过</span></td></tr>`).join('')}</tbody></table></div>
  <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
    <button class="btn" onclick="UP.step=1;$('#up-body').innerHTML=uploadStepHtml()">重新选择</button>
    <button class="btn btn-primary" id="up-import" onclick="toast('已导入 '+UP.ok+' 条数据');closeModal();router();">确认导入 ${UP.ok} 条</button>
  </div>`;
}
function upPick(input){
  const f=input.files&&input.files[0];
  if(!f)return;
  UP.fileName=f.name;UP.step=2;UP.ok=12;UP.err=2;
  $('#up-body').innerHTML=uploadStepHtml();
  toast('文件解析完成：共 14 行数据','info');
}
function upDrop(e){e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)upPick({files:[f]});}
/* ===================== 初始化 ===================== */
renderNav();
if(!location.hash)location.hash='#/login';
router();
</script>
</body>
</html>
